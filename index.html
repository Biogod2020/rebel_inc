iv>${meter(p.progress / p.total * 100, 'gold')}<small>${Afterfire.controlled(d) ? '武装占领，施工暂停' : !d.supplied ? '补给中断，施工严重减速' : `基础剩余约 ${Math.ceil(p.total - p.progress)} 周，受地形和后勤修正`}</small></div>` : ''}<h3 class="section-title">地方建设 <small>${s.districts.filter(d => d.project).length} / ${4 + s.policies.logistics} 工程队</small></h3><div class="project-grid">${Object.keys(Afterfire.PROJECTS).map(kind => { const def = Afterfire.PROJECTS[kind], reason = Afterfire.projectAllowed(s, d.id, kind), max = d.levels[kind] >= def.max; return `<button class="project-card ${d.demand === kind && !d.levels[kind] ? 'urgent' : ''} ${max ? 'maxed' : ''}" data-project="${kind}" ${reason ? 'disabled' : ''} title="${Afterfire.escape(def.desc + (reason ? '\n' + reason : ''))}"><span class="cost">${max ? '✓' : '$' + Afterfire.projectCost(s, d.id, kind)}</span>${Afterfire.icon(def.icon)}<strong>${def.name}</strong><span class="level">${max ? '已完成最高等级' : `LV ${d.levels[kind]} → ${d.levels[kind] + 1} · ${def.weeks}周`}</span></button>`; }).join('')}</div><div class="divider"></div><p class="panel-sub">民心超过 53%、武装基本清除且补给连通时，地区开始积累稳定。民心增长不等于立即稳定。</p>`;
